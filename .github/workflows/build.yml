name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    name: Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Use LLVM 19 (fmt 11.0.2 does not compile with Clang 20)
        shell: pwsh
        run: |
          choco install llvm --version=19.1.7 --allow-downgrade --force -y
          & "C:\Program Files\LLVM\bin\clang++.exe" --version

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          bindings: geode-sdk/bindings
          bindings-ref: main
          sdk: nightly
          combine: true
          target: Win64

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ["build"]
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
